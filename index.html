<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trình Cài Đặt VPN Siêu Cấp</title>
  
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            appBg: '#09090b',
            appCard: '#18181b',
            appBorder: '#27272a',
            brand: '#f97316',
            brandHover: '#ea580c',
            textMain: '#fafafa',
            textMuted: '#a1a1aa',
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style type="text/tailwindcss">
    @layer utilities {
      .solid-card { @apply bg-appCard border border-appBorder shadow-2xl; }
      .custom-scrollbar::-webkit-scrollbar { width: 5px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { @apply bg-appBorder rounded-full; }
      [v-cloak] { display: none !important; }
    }
    body { background-color: #09090b; color: #fafafa; }
  </style>
</head>

<body class="antialiased min-h-screen flex flex-col relative overflow-x-hidden text-sm sm:text-base">

  <div id="app" v-cloak class="flex-grow flex flex-col items-center justify-center p-4 sm:p-6 z-10">

    <div class="w-full max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-[3.5fr_6.5fr] gap-6 lg:gap-10 items-start">

      <!-- Left Side -->
      <div class="lg:sticky lg:top-10 space-y-8 text-center lg:text-left pt-4">
        <div>
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-br from-brand to-rose-600 mb-5 shadow-lg">
            <i class="fas fa-bolt text-xl text-white"></i>
          </div>
          <h1 class="text-3xl sm:text-4xl font-extrabold text-white uppercase tracking-tighter">VPNSIEUCAP</h1>
          <p class="text-textMuted text-sm font-medium leading-relaxed">Cài đặt trực quan qua hình ảnh.</p>
        </div>

        <div class="flex items-center justify-center lg:justify-start gap-2">
          <template v-for="i in 7" :key="i">
            <div class="h-2 rounded-full transition-all duration-500" :class="step >= i ? 'w-8 bg-brand' : 'w-4 bg-appBorder'"></div>
          </template>
        </div>
      </div>

      <!-- Right Side -->
      <div class="w-full relative">
        <transition name="fade" mode="out-in">

          <!-- Các bước 1-6 giữ nguyên logic cũ của bạn... (Rút gọn để tập trung vào Bước 7) -->
          <div v-if="step < 7" class="solid-card p-10 rounded-2xl text-center">
             <h2 class="text-xl font-bold mb-6 text-white">Bước {{step}}</h2>
             <button @click="nextStep" class="px-8 py-3 bg-white text-black rounded-xl font-bold">Tiếp tục</button>
             <p class="mt-4 text-textMuted text-xs">Vui lòng hoàn thành các lựa chọn trước đó.</p>
          </div>

          <!-- Step 7: Hướng dẫn chi tiết kèm ẢNH DƯỚI CHỮ -->
          <div v-else-if="step === 7" key="step7" class="solid-card rounded-2xl flex flex-col h-[650px] overflow-hidden">
            
            <div class="p-5 border-b border-appBorder bg-appBg/90 backdrop-blur-md sticky top-0 z-20 flex justify-between items-center">
              <h3 class="font-bold text-lg text-white uppercase tracking-tight">Hướng dẫn chi tiết</h3>
              <button @click="resetFlow" class="w-8 h-8 rounded-lg bg-appBorder flex items-center justify-center hover:bg-white hover:text-black transition-all">
                <i class="fas fa-rotate-left text-xs"></i>
              </button>
            </div>

            <div class="flex-1 overflow-y-auto p-5 sm:p-8 custom-scrollbar space-y-10">
              
              <!-- Vòng lặp hiển thị: CHỮ TRÊN - ẢNH DƯỚI -->
              <div v-for="(item, index) in currentTutorial" :key="index" class="space-y-4 animate-fade-in">
                <div class="flex gap-4">
                  <div class="flex-shrink-0 w-8 h-8 rounded-lg bg-brand/10 border border-brand/20 text-brand font-bold flex items-center justify-center">
                    {{ index + 1 }}
                  </div>
                  <p class="text-slate-200 font-medium leading-relaxed pt-1">{{ item.text }}</p>
                </div>

                <!-- Khung chứa ảnh minh họa -->
                <div class="ml-12 group">
                  <img :src="item.image" 
                       :alt="'Minh họa bước ' + (index + 1)"
                       class="w-full max-w-md rounded-xl border border-appBorder shadow-xl group-hover:border-brand/50 transition-colors duration-300">
                </div>
              </div>

              <!-- Mục Video -->
              <div class="pt-6 border-t border-appBorder">
                <h4 class="font-bold text-white mb-4 flex items-center gap-2">
                  <i class="fab fa-youtube text-brand"></i> Video thực tế
                </h4>
                <div class="aspect-video rounded-xl overflow-hidden border border-appBorder bg-black">
                   <iframe class="w-full h-full" :src="videoLink" frameborder="0" allowfullscreen></iframe>
                </div>
              </div>

            </div>
          </div>

        </transition>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed } = Vue;

    createApp({
      setup() {
        const step = ref(7); // Để mặc định 7 để bạn dễ xem giao diện ảnh
        const platform = ref('tv360'); // 'tiktok' hoặc 'tv360'
        const os = ref('ios'); // 'android' hoặc 'ios'

        const resetFlow = () => { step.value = 1; };
        const nextStep = () => { step.value++; };

        // DỮ LIỆU HƯỚNG DẪN: CHỮ VÀ LINK ẢNH TƯƠNG ỨNG
        const currentTutorial = computed(() => {
          if (platform.value === 'tv360') {
            if (os.value === 'android') {
              return [
                { text: "Mở app Platform Next trên Android.", image: "https://via.placeholder.com/600x300/18181b/f97316?text=Anh+Mo+App+Android" },
                { text: "Đăng nhập web và bấm Đồng bộ TV360.", image: "https://via.placeholder.com/600x300/18181b/f97316?text=Anh+Dong+Bo+Web" },
                { text: "Nhấn nút Kết nối to ở giữa.", image: "https://via.placeholder.com/600x300/18181b/f97316?text=Anh+Ket+Noi" }
              ];
            } else {
              return [
                { text: "Mở app Platform Next trên iPhone.", image: "https://via.placeholder.com/600x300/18181b/f97316?text=Anh+Mo+App+iOS" },
                { text: "Cho phép thêm cấu hình VPN.", image: "https://via.placeholder.com/600x300/18181b/f97316?text=Anh+Cap+Quyen+VPN" },
                { text: "Bật công tắc để sử dụng.", image: "https://via.placeholder.com/600x300/18181b/f97316?text=Anh+Bat+Mang" }
              ];
            }
          } else {
             // Tương tự cho nền Tiktok...
             return [
                { text: "Mở Shadowrocket và chọn server.", image: "https://via.placeholder.com/400x200?text=Shadowrocket+1" }
             ];
          }
        });

        const videoLink = computed(() => {
            return os.value === 'ios' ? "https://www.veed.io/embed/b9b4692d-36ed-4350-8674-5e52d17a7a7a" : "https://www.youtube.com/embed/ID_VIDEO_ANDROID";
        });

        return { step, platform, os, resetFlow, nextStep, currentTutorial, videoLink };
      }
    }).mount('#app');
  </script>
</body>
</html>
