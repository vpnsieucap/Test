<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN - Cosmic Liquid Glass</title>
    <style>
        /* RESET & FONT */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* NỀN VŨ TRỤ */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0b0f19; /* Đen không gian */
            overflow: hidden;
            position: relative;
        }

        /* CÁC QUẢ CẦU NĂNG LƯỢNG (HIỆU ỨNG VŨ TRỤ LỎNG) */
        .cosmic-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: floatOrb 10s infinite alternate ease-in-out;
            z-index: 1;
        }
        
        .orb-1 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #ec4899, #f97316);
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        /* KHUNG KÍNH LỎNG (LIQUID GLASSMORPHISM) */
        .glass-panel {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.03); /* Trong suốt nhẹ */
            border-radius: 30px;
            
            /* Hiệu ứng kính */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            
            /* Viền sáng mỏng tạo cảm giác kính nổi */
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            
            /* Đổ bóng */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: white;
            transition: transform 0.3s ease;
        }

        .glass-panel:hover {
            transform: translateY(-5px);
        }

        /* NỘI DUNG */
        h2 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(255,255,255,0.2);
        }

        p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-bottom: 40px;
        }

        /* NÚT BẤM (BUTTON) */
        .btn-connect {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(255,255,255,0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            overflow: hidden;
        }

        /* Vòng năng lượng quanh nút */
        .btn-connect::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #7c3aed, #00f2fe, #ec4899);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .btn-connect:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(124, 58, 237, 0.4), inset 0 0 20px rgba(255,255,255,0.1);
        }

        .btn-connect:hover::before {
            opacity: 1;
            animation: spin 3s linear infinite;
        }

        /* THÔNG TIN MẠNG */
        .status-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .status-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-value {
            font-size: 16px;
            font-weight: 500;
        }

        /* ANIMATION */
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.2); }
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Các quầng sáng năng lượng vũ trụ phía sau -->
    <div class="cosmic-orb orb-1"></div>
    <div class="cosmic-orb orb-2"></div>

    <!-- Khung kính lỏng -->
    <div class="glass-panel">
        <h2>Quantum VPN</h2>
        <p>Kết nối an toàn trong không gian mạng</p>

        <button class="btn-connect">
            KẾT NỐI
        </button>

        <div class="status-bar">
            <div class="status-item">
                <span class="status-label">IP Address</span>
                <span class="status-value">Hidden</span>
            </div>
            <div class="status-item">
                <span class="status-label">Location</span>
                <span class="status-value">Singapore</span>
            </div>
        </div>
    </div>

</body>
</html>
